<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin OTP Verification - EventSphere</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="otp-page">

    <div class="otp-box">

        <div class="admin-icon">
            🛡️
        </div>

        <h1>Admin Login</h1>

        <p>
            Enter the OTP sent to your admin email<br>
            to access the dashboard.
        </p>

        <div class="otp-line"></div>

        <form id="adminOtpForm">

            <div class="otp-inputs">

                <input type="text" maxlength="1" class="otp-digit" autofocus>
                <input type="text" maxlength="1" class="otp-digit">
                <input type="text" maxlength="1" class="otp-digit">
                <input type="text" maxlength="1" class="otp-digit">
                <input type="text" maxlength="1" class="otp-digit">
                <input type="text" maxlength="1" class="otp-digit">

            </div>

            <input type="hidden" id="adminOtp">

            <button type="submit">
                Verify OTP
            </button>

        </form>

        <p class="resend-text">
            Didn't receive the OTP?
        </p>

        <button id="resendAdminOtp" class="resend-button">
            Resend OTP
        </button>

        <div class="secure-text">
            🔒 Secure access to your admin dashboard
        </div>

    </div>

</div>

<script type="module" src="js/admin-otp.js"></script>

<script>

const otpInputs = document.querySelectorAll(".otp-digit");
const hiddenOtp = document.getElementById("adminOtp");

otpInputs.forEach((input, index) => {

    input.addEventListener("input", () => {

        input.value = input.value.replace(/\D/g, "");

        if (input.value && index < otpInputs.length - 1) {
            otpInputs[index + 1].focus();
        }

        hiddenOtp.value =
            Array.from(otpInputs).map(i => i.value).join("");

    });

    input.addEventListener("keydown", (e) => {

        if (
            e.key === "Backspace" &&
            !input.value &&
            index > 0
        ) {
            otpInputs[index - 1].focus();
        }

    });

});

</script>

</body>

</html>
