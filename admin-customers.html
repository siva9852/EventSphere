<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Customers - EventSphere</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="customers-dashboard">

    <!-- SIDEBAR -->
    <aside class="customers-sidebar">

        <div class="customers-logo">
            🎪 <span>Event<span>Sphere</span></span>
        </div>

        <nav>

            <a href="admin-dashboard.html">
                🏠
                <span>Dashboard</span>
            </a>

            <a href="add-event.html">
                ➕
                <span>Add Event</span>
            </a>

            <a href="view-events.html">
                🎉
                <span>View Events</span>
            </a>

            <a href="admin-bookings.html">
                📅
                <span>Bookings</span>
            </a>

            <a href="admin-customers.html" class="customers-active">
                👥
                <span>Customers</span>
            </a>

            <a href="#" onclick="logout()">
                🚪
                <span>Logout</span>
            </a>

        </nav>


        <div class="admin-profile">

            <div class="admin-profile-icon">
                👤
            </div>

            <div>
                <strong>Admin</strong>
                <small>admin@eventsphere.com</small>
            </div>

        </div>

    </aside>


    <!-- MAIN CONTENT -->
    <main class="customers-main">

        <div class="customers-top">

            <div>

                <h1>Registered Customers</h1>

                <div class="customers-title-line"></div>

            </div>


            <div class="customer-search">

                🔍

                <input
                    type="text"
                    id="customerSearch"
                    placeholder="Search customers..."
                >

            </div>


            <button
                class="customer-filter-btn"
                id="customerFilterBtn">

                ⚱

            </button>

        </div>


        <!-- TOTAL CUSTOMERS -->

        <div class="total-customers-card">

            <div class="total-customers-icon">
                👥
            </div>

            <div>

                <span>Total Customers</span>

                <strong id="totalCustomers">
                    0
                </strong>

            </div>

        </div>


        <!-- CUSTOMERS -->

        <div id="customersContainer">

            <p class="customers-loading">
                Loading customers...
            </p>

        </div>


        <!-- PAGINATION -->

        <div class="customers-pagination">

            <span id="customerShowing">
                Showing 0 customers
            </span>


            <div class="pagination-buttons">

                <button id="previousPage">
                    ‹
                </button>

                <div id="pageNumbers"></div>

                <button id="nextPage">
                    ›
                </button>

            </div>

        </div>

    </main>

</div>


<script type="module"
        src="js/admin-customers.js">
</script>

</body>

</html>
