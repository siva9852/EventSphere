<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Bookings - EventSphere</title>

    <link rel="stylesheet"
          href="css/style.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


    <style>

        /* =====================================================
           CANCEL BOOKING POPUP
           ===================================================== */

        .cancel-booking-overlay {

            position: fixed;

            inset: 0;

            background: rgba(15, 23, 42, 0.55);

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;

            z-index: 9999;

            backdrop-filter: blur(4px);

        }


        .cancel-booking-modal {

            width: 100%;

            max-width: 440px;

            background: #ffffff;

            border-radius: 18px;

            padding: 28px;

            box-sizing: border-box;

            box-shadow:
                0 20px 50px
                rgba(15, 23, 42, 0.22);

            position: relative;

            animation: cancelModalIn 0.2s ease;

        }


        @keyframes cancelModalIn {

            from {

                opacity: 0;

                transform: translateY(10px) scale(0.98);

            }

            to {

                opacity: 1;

                transform: translateY(0) scale(1);

            }

        }


        .cancel-modal-icon {

            width: 50px;

            height: 50px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 14px;

            background: #fff1f2;

            color: #dc2626;

            font-size: 21px;

            margin-bottom: 15px;

        }


        .cancel-booking-modal h2 {

            margin: 0 0 7px;

            color: #172554;

            font-size: 23px;

        }


        .cancel-modal-event {

            margin: 0 0 20px;

            color: #64748b;

            font-size: 14px;

        }


        .cancel-reason-label {

            display: block;

            margin-bottom: 7px;

            color: #334155;

            font-size: 14px;

            font-weight: 700;

        }


        .cancel-reason-required {

            color: #dc2626;

        }


        .cancel-reason-input {

            width: 100%;

            min-height: 100px;

            padding: 12px 13px;

            box-sizing: border-box;

            border: 1px solid #d5dce8;

            border-radius: 10px;

            resize: vertical;

            outline: none;

            font-family: inherit;

            font-size: 14px;

            color: #172554;

            background: #fbfcff;

        }


        .cancel-reason-input:focus {

            border-color: #dc2626;

            box-shadow:
                0 0 0 3px
                rgba(220, 38, 38, 0.08);

            background: #ffffff;

        }


        .cancel-reason-input::placeholder {

            color: #94a3b8;

        }


        .cancel-modal-actions {

            display: flex;

            justify-content: flex-end;

            gap: 10px;

            margin-top: 20px;

        }


        .cancel-modal-btn {

            height: 40px;

            padding: 0 17px;

            border-radius: 8px;

            font-size: 14px;

            font-weight: 700;

            cursor: pointer;

            border: none;

        }


        .cancel-close-btn {

            background: #f1f5f9;

            color: #475569;

        }


        .cancel-close-btn:hover {

            background: #e2e8f0;

        }


        .cancel-confirm-btn {

            background: #dc2626;

            color: white;

        }


        .cancel-confirm-btn:hover {

            background: #b91c1c;

        }


        /* ================= CANCELLED STATUS ================= */

        .booking-status.cancelled {

            background: #f1f5f9;

            color: #475569;

        }


        /* ================= CANCEL BUTTON ================= */

        .customer-cancel-booking-btn {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            gap: 7px;

            margin-left: 10px;

            padding: 8px 14px;

            border: 1px solid #fecaca;

            border-radius: 8px;

            background: #fff5f5;

            color: #dc2626;

            font-size: 13px;

            font-weight: 700;

            cursor: pointer;

            transition: 0.2s;

        }


        .customer-cancel-booking-btn:hover {

            background: #fee2e2;

            border-color: #fca5a5;

        }


        @media (max-width: 600px) {

            .cancel-booking-modal {

                padding: 22px;

            }


            .cancel-modal-actions {

                flex-direction: column-reverse;

            }


            .cancel-modal-btn {

                width: 100%;

            }

        }

    </style>

</head>


<body>


<div class="modern-dashboard">


    <!-- ================= SIDEBAR ================= -->

    <aside class="modern-sidebar">


        <div class="sidebar-logo">

            🎪

            <span>
                Event<span>Sphere</span>
            </span>

        </div>


        <nav class="sidebar-nav">


            <a href="customer-dashboard.html">

                <span class="nav-icon">
                    ⌂
                </span>

                Dashboard

            </a>


            <a href="customer-events.html">

                <span class="nav-icon">
                    🎉
                </span>

                Events

            </a>


            <a href="my-bookings.html"
               class="sidebar-active">

                <span class="nav-icon">
                    ▣
                </span>

                My Bookings

            </a>


            <a href="#"
               onclick="logout()">

                <span class="nav-icon logout-icon">
                    ⏻
                </span>

                Logout

            </a>


        </nav>


        <!-- ================= CUSTOMER PROFILE ================= -->

        <div class="customer-profile">

            <div class="profile-avatar">
                👤
            </div>


            <div class="profile-info">

                <strong id="customerName">
                    Customer
                </strong>


                <small id="customerEmail">
                    Loading...
                </small>

            </div>


            <span class="profile-arrow">
                ⌄
            </span>

        </div>


    </aside>


    <!-- ================= MAIN ================= -->

    <main class="modern-main">


        <div class="top-bar">
            <div></div>
        </div>


        <!-- ================= PAGE HEADING ================= -->

        <div class="page-heading">

            <h1>
                My Bookings
            </h1>


            <p>
                View and track all your event bookings
            </p>


            <div class="heading-line"></div>

        </div>


        <!-- ================= BOOKINGS ================= -->

        <div id="myBookingsContainer">

            <p class="loading-bookings">
                Loading bookings...
            </p>

        </div>


    </main>


</div>


<!-- ================= AUTH ================= -->

<script type="module"
        src="js/auth.js">
</script>


<!-- ================= MY BOOKINGS ================= -->

<script type="module"
        src="js/my-bookings.js">
</script>


</body>

</html>
