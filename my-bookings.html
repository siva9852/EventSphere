<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Bookings - EventSphere</title>


    <!-- MAIN CSS -->

    <link rel="stylesheet"
          href="css/style.css">


    <!-- FONT AWESOME -->

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


    <style>

        /* =====================================================
           CUSTOMER BOOKINGS PAGE
           ===================================================== */

        body {

            background:
                linear-gradient(
                    135deg,
                    #f8faff 0%,
                    #eef4ff 50%,
                    #f8fbff 100%
                );

        }


        /* =====================================================
           MAIN LAYOUT
           ===================================================== */

        .modern-dashboard {

            min-height: 100vh;

            display: flex;

            background:
                linear-gradient(
                    135deg,
                    #f7faff,
                    #eef4ff
                );

        }


        /* =====================================================
           SIDEBAR
           ===================================================== */

        .modern-sidebar {

            width: 250px;

            min-height: 100vh;

            background:
                linear-gradient(
                    180deg,
                    #102b63 0%,
                    #18366f 50%,
                    #214584 100%
                );

            color: white;

            position: fixed;

            left: 0;

            top: 0;

            bottom: 0;

            display: flex;

            flex-direction: column;

            z-index: 1000;

            box-shadow:
                8px 0 30px
                rgba(15, 35, 75, 0.12);

        }


        /* =====================================================
           LOGO
           ===================================================== */

        .sidebar-logo {

            height: 82px;

            display: flex;

            align-items: center;

            gap: 10px;

            padding: 0 25px;

            font-size: 23px;

            font-weight: 800;

            border-bottom:
                1px solid
                rgba(255,255,255,0.10);

        }


        .sidebar-logo > span {

            letter-spacing: -0.5px;

        }


        .sidebar-logo > span span {

            color: #7dd3fc;

        }


        /* =====================================================
           SIDEBAR NAVIGATION
           ===================================================== */

        .sidebar-nav {

            padding: 25px 15px;

            display: flex;

            flex-direction: column;

            gap: 8px;

        }


        .sidebar-nav a {

            text-decoration: none;

            color:
                rgba(255,255,255,0.72);

            padding: 13px 15px;

            border-radius: 12px;

            display: flex;

            align-items: center;

            gap: 12px;

            font-size: 14px;

            font-weight: 600;

            transition:
                all 0.25s ease;

        }


        .sidebar-nav a:hover {

            color: white;

            background:
                rgba(255,255,255,0.10);

            transform:
                translateX(3px);

        }


        .sidebar-nav a.sidebar-active {

            color: white;

            background:
                linear-gradient(
                    135deg,
                    rgba(96,165,250,0.28),
                    rgba(59,130,246,0.18)
                );

            box-shadow:
                inset 3px 0 0 #60a5fa;

        }


        .nav-icon {

            width: 30px;

            height: 30px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 9px;

            background:
                rgba(255,255,255,0.08);

            font-size: 15px;

        }


        .sidebar-active .nav-icon {

            background:
                rgba(96,165,250,0.20);

        }


        /* =====================================================
           CUSTOMER PROFILE
           ===================================================== */

        .customer-profile {

            margin:
                auto 15px 20px;

            padding: 13px;

            display: flex;

            align-items: center;

            gap: 11px;

            background:
                rgba(255,255,255,0.08);

            border:
                1px solid
                rgba(255,255,255,0.10);

            border-radius: 14px;

        }


        .profile-avatar {

            width: 40px;

            height: 40px;

            flex-shrink: 0;

            border-radius: 12px;

            display: flex;

            align-items: center;

            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    #60a5fa,
                    #38bdf8
                );

            font-size: 19px;

        }


        .profile-info {

            min-width: 0;

            flex: 1;

        }


        .profile-info strong {

            display: block;

            color: white;

            font-size: 13px;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;

        }


        .profile-info small {

            display: block;

            margin-top: 3px;

            color:
                rgba(255,255,255,0.55);

            font-size: 10px;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;

        }


        .profile-arrow {

            color:
                rgba(255,255,255,0.55);

            font-size: 17px;

        }


        /* =====================================================
           MAIN
           ===================================================== */

        .modern-main {

            margin-left: 250px;

            width:
                calc(100% - 250px);

            min-height: 100vh;

            padding:
                25px 35px 50px;

            box-sizing: border-box;

        }


        /* =====================================================
           TOP BAR
           ===================================================== */

        .top-bar {

            height: 55px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            margin-bottom: 10px;

        }


        .top-bar-left {

            display: flex;

            align-items: center;

            gap: 10px;

            color: #64748b;

            font-size: 13px;

        }


        .top-bar-left i {

            color: #2563eb;

        }


        .top-bar-right {

            display: flex;

            align-items: center;

            gap: 10px;

        }


        .top-icon-button {

            width: 42px;

            height: 42px;

            border-radius: 12px;

            border:
                1px solid #e2e8f0;

            background: white;

            display: flex;

            align-items: center;

            justify-content: center;

            color: #475569;

            box-shadow:
                0 5px 18px
                rgba(15,23,42,0.05);

        }


        .top-icon-button i {

            font-size: 15px;

        }


        /* =====================================================
           PAGE HEADING
           ===================================================== */

        .page-heading {

            position: relative;

            margin:
                15px 0 28px;

            padding:
                28px 30px;

            border-radius: 22px;

            overflow: hidden;

            background:
                linear-gradient(
                    135deg,
                    #18366f 0%,
                    #2563a9 55%,
                    #0ea5e9 100%
                );

            color: white;

            box-shadow:
                0 15px 40px
                rgba(37,99,235,0.16);

        }


        .page-heading::before {

            content: "";

            position: absolute;

            width: 220px;

            height: 220px;

            border-radius: 50%;

            background:
                rgba(255,255,255,0.08);

            right: -70px;

            top: -110px;

        }


        .page-heading::after {

            content: "";

            position: absolute;

            width: 150px;

            height: 150px;

            border-radius: 50%;

            background:
                rgba(255,255,255,0.06);

            right: 130px;

            bottom: -100px;

        }


        .page-heading-content {

            position: relative;

            z-index: 2;

        }


        .page-heading h1 {

            margin: 0;

            font-size: 29px;

            font-weight: 800;

            letter-spacing: -0.7px;

        }


        .page-heading p {

            margin:
                8px 0 0;

            color:
                rgba(255,255,255,0.76);

            font-size: 14px;

        }


        .heading-badge {

            display: inline-flex;

            align-items: center;

            gap: 7px;

            margin-bottom: 12px;

            padding: 7px 11px;

            border-radius: 30px;

            background:
                rgba(255,255,255,0.12);

            border:
                1px solid
                rgba(255,255,255,0.14);

            font-size: 11px;

            font-weight: 700;

            letter-spacing: 0.4px;

        }


        /* =====================================================
           BOOKING CONTAINER
           ===================================================== */

        #myBookingsContainer {

            width: 100%;

        }


        /* =====================================================
           LOADING
           ===================================================== */

        .loading-bookings {

            min-height: 180px;

            display: flex;

            align-items: center;

            justify-content: center;

            color: #64748b;

            font-size: 14px;

            background: white;

            border:
                1px solid #e2e8f0;

            border-radius: 18px;

            box-shadow:
                0 8px 25px
                rgba(15,23,42,0.05);

        }


        /* =====================================================
           NO BOOKINGS
           ===================================================== */

        .no-bookings {

            background: white;

            border:
                1px solid #e2e8f0;

            border-radius: 22px;

            padding: 55px 25px;

            text-align: center;

            box-shadow:
                0 10px 30px
                rgba(15,23,42,0.05);

        }


        .no-bookings > div:first-child {

            width: 72px;

            height: 72px;

            margin:
                0 auto 18px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 20px;

            background: #eff6ff;

            color: #2563eb;

            font-size: 34px !important;

        }


        .no-bookings h2 {

            margin: 0 0 8px;

            color: #172554;

            font-size: 22px;

        }


        .no-bookings p {

            margin: 0;

            color: #64748b;

            font-size: 14px;

        }


        /* =====================================================
           MODERN BOOKING CARDS
           ===================================================== */

        .modern-booking-card {

            position: relative;

            background: white;

            border:
                1px solid #e2e8f0;

            border-radius: 20px;

            overflow: hidden;

            margin-bottom: 22px;

            box-shadow:
                0 10px 30px
                rgba(15,23,42,0.06);

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease;

        }


        .modern-booking-card:hover {

            transform:
                translateY(-3px);

            box-shadow:
                0 18px 42px
                rgba(15,23,42,0.10);

        }


        .booking-event-image {

            width: 100%;

            height: 220px;

            display: block;

            object-fit: cover;

            background: #e2e8f0;

        }


        .booking-main {

            padding: 25px;

        }


        .booking-id-label {

            color: #94a3b8;

            font-size: 10px;

            font-weight: 800;

            letter-spacing: 1px;

        }


        .booking-id-value {

            display: inline-block;

            margin-top: 5px;

            padding: 5px 9px;

            border-radius: 7px;

            background: #eff6ff;

            color: #2563eb;

            font-size: 11px;

            font-weight: 800;

        }


        .booking-main h2 {

            margin:
                14px 0 20px;

            color: #172554;

            font-size: 23px;

            font-weight: 800;

        }


        /* =====================================================
           BOOKING DETAILS
           ===================================================== */

        .booking-details {

            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 12px;

        }


        .booking-detail {

            display: flex;

            align-items: center;

            gap: 11px;

            padding: 13px;

            border:
                1px solid #edf2f7;

            border-radius: 12px;

            background: #f8fafc;

        }


        .booking-detail-icon {

            width: 38px;

            height: 38px;

            flex-shrink: 0;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 10px;

            background: #eff6ff;

            color: #2563eb;

            font-size: 16px;

        }


        .booking-detail-content {

            min-width: 0;

        }


        .booking-detail-content small {

            display: block;

            margin-bottom: 4px;

            color: #94a3b8;

            font-size: 10px;

            font-weight: 700;

        }


        .booking-detail-content strong {

            display: block;

            color: #334155;

            font-size: 13px;

            word-break: break-word;

        }


        /* =====================================================
           BOOKING STATUS
           ===================================================== */

        .booking-status {

            margin:
                0 25px 18px;

            display: inline-flex;

            align-items: center;

            padding: 8px 13px;

            border-radius: 30px;

            font-size: 12px;

            font-weight: 800;

        }


        .booking-status.pending {

            background: #fff7ed;

            color: #c2410c;

        }


        .booking-status.approved {

            background: #ecfdf5;

            color: #15803d;

        }


        .booking-status.cancelled {

            background: #f1f5f9;

            color: #475569;

        }


        .booking-status.rejected {

            background: #fef2f2;

            color: #dc2626;

        }


        /* =====================================================
           BOOKING BOTTOM
           ===================================================== */

        .booking-bottom {

            padding:
                18px 25px;

            display: flex;

            align-items: center;

            flex-wrap: wrap;

            gap: 10px;

            border-top:
                1px solid #edf2f7;

            background: #fbfdff;

        }


        .booking-bottom button {

            border: none;

            min-height: 40px;

            padding:
                9px 15px;

            border-radius: 9px;

            cursor: pointer;

            font-size: 12px;

            font-weight: 700;

            transition:
                all 0.2s ease;

        }


        .view-details-btn {

            background: #eff6ff;

            color: #2563eb;

        }


        .view-details-btn:hover {

            background: #dbeafe;

        }


        .pay-now-btn {

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #1d4ed8
                );

            color: white;

            box-shadow:
                0 5px 15px
                rgba(37,99,235,0.20);

        }


        .pay-now-btn:hover {

            transform:
                translateY(-1px);

            box-shadow:
                0 8px 20px
                rgba(37,99,235,0.28);

        }


        .download-receipt-btn {

            background: #ecfdf5;

            color: #15803d;

        }


        .download-receipt-btn:hover {

            background: #dcfce7;

        }


        .customer-cancel-booking-btn {

            background: #fff5f5 !important;

            color: #dc2626 !important;

            border:
                1px solid #fecaca !important;

        }


        .customer-cancel-booking-btn:hover {

            background: #fee2e2 !important;

        }


        .booking-paid-label {

            display: inline-flex;

            align-items: center;

            gap: 7px;

            padding:
                8px 12px;

            border-radius: 30px;

            background: #ecfdf5;

            border:
                1px solid #bbf7d0;

            color: #15803d;

            font-size: 12px;

            font-weight: 800;

        }


        /* =====================================================
           RESPONSIVE
           ===================================================== */

        @media (max-width: 900px) {

            .modern-sidebar {

                width: 215px;

            }


            .modern-main {

                margin-left: 215px;

                width:
                    calc(100% - 215px);

                padding:
                    22px;

            }


            .booking-details {

                grid-template-columns: 1fr;

            }

        }


        @media (max-width: 700px) {

            .modern-sidebar {

                width: 72px;

            }


            .sidebar-logo {

                justify-content: center;

                padding: 0;

                font-size: 0;

            }


            .sidebar-logo:first-letter {

                font-size: 25px;

            }


            .sidebar-logo > span {

                display: none;

            }


            .sidebar-nav {

                padding:
                    20px 10px;

            }


            .sidebar-nav a {

                justify-content: center;

                padding: 12px;

                font-size: 0;

            }


            .nav-icon {

                width: 34px;

                height: 34px;

            }


            .customer-profile {

                margin:
                    auto 8px 12px;

                padding: 8px;

                justify-content: center;

            }


            .profile-info,

            .profile-arrow {

                display: none;

            }


            .modern-main {

                margin-left: 72px;

                width:
                    calc(100% - 72px);

                padding:
                    15px;

            }


            .page-heading {

                padding: 23px;

                border-radius: 18px;

            }


            .page-heading h1 {

                font-size: 23px;

            }


            .booking-event-image {

                height: 180px;

            }

        }


        @media (max-width: 480px) {

            .top-bar {

                height: 45px;

            }


            .top-bar-left {

                font-size: 11px;

            }


            .top-icon-button {

                width: 36px;

                height: 36px;

            }


            .page-heading {

                margin-bottom: 20px;

            }


            .page-heading p {

                font-size: 12px;

            }


            .booking-main {

                padding: 18px;

            }


            .booking-main h2 {

                font-size: 20px;

            }


            .booking-bottom {

                padding:
                    15px 18px;

                flex-direction: column;

                align-items: stretch;

            }


            .booking-bottom button,

            .booking-paid-label {

                width: 100%;

                justify-content: center;

                box-sizing: border-box;

            }

        }

    </style>

</head>


<body>


<div class="modern-dashboard">


    <!-- =================================================
         SIDEBAR
         ================================================= -->

    <aside class="modern-sidebar">


        <!-- LOGO -->

        <div class="sidebar-logo">

            🎪

            <span>
                Event<span>Sphere</span>
            </span>

        </div>


        <!-- NAVIGATION -->

        <nav class="sidebar-nav">


            <a href="customer-dashboard.html">

                <span class="nav-icon">
                    <i class="fa-solid fa-house"></i>
                </span>

                Dashboard

            </a>


            <a href="customer-events.html">

                <span class="nav-icon">
                    <i class="fa-solid fa-calendar-days"></i>
                </span>

                Events

            </a>


            <a href="my-bookings.html"
               class="sidebar-active">

                <span class="nav-icon">
                    <i class="fa-solid fa-ticket"></i>
                </span>

                My Bookings

            </a>


        </nav>


        <!-- CUSTOMER PROFILE -->

        <div class="customer-profile">

            <div class="profile-avatar">
                <i class="fa-solid fa-user"></i>
            </div>


            <div class="profile-info">

                <strong id="customerName">
                    Customer
                </strong>


                <small id="customerEmail">
                    Loading...
                </small>

            </div>


            <span class="profile-arrow">
                <i class="fa-solid fa-chevron-right"></i>
            </span>

        </div>


    </aside>


    <!-- =================================================
         MAIN CONTENT
         ================================================= -->

    <main class="modern-main">


        <!-- TOP BAR -->

        <div class="top-bar">


            <div class="top-bar-left">

                <i class="fa-solid fa-house"></i>

                <span>
                    Customer / My Bookings
                </span>

            </div>


            <div class="top-bar-right">

                <div class="top-icon-button">

                    <i class="fa-regular fa-bell"></i>

                </div>

            </div>


        </div>


        <!-- =================================================
             PAGE HEADER
             ================================================= -->

        <section class="page-heading">


            <div class="page-heading-content">


                <div class="heading-badge">

                    <i class="fa-solid fa-ticket"></i>

                    YOUR BOOKINGS

                </div>


                <h1>
                    My Bookings
                </h1>


                <p>
                    View, manage and track all your event bookings
                    in one place.
                </p>


            </div>


        </section>


        <!-- =================================================
             BOOKINGS
             ================================================= -->

        <div id="myBookingsContainer">


            <p class="loading-bookings">

                <i class="fa-solid fa-spinner fa-spin"></i>

                &nbsp;

                Loading bookings...

            </p>


        </div>


    </main>


</div>


<!-- =====================================================
     AUTH
     ===================================================== -->

<script type="module"
        src="js/auth.js">
</script>


<!-- =====================================================
     MY BOOKINGS
     ===================================================== -->

<script type="module"
        src="js/my-bookings.js">
</script>


</body>

</html>
