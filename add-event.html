<!DOCTYPE html>

<head>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="dashboard">

    <div class="sidebar">

        <h2>EventSphere</h2>

        <ul>

            <li><a href="admin-dashboard.html">🏠 Dashboard</a></li>

            <li><a href="add-event.html">➕ Add Event</a></li>

            <li><a href="view-events.html">🎉 View Events</a></li>

        </ul>

    </div>

    <div class="dashboard-content">

        <h1>Add New Event</h1>

        <form id="addEventForm">

            <input type="text" id="eventName" placeholder="Event Name" required>

            <input type="text" id="category" placeholder="Category" required>

            <input type="number" id="price" placeholder="Price" required>

            <input type="text" id="image" placeholder="Image URL" required>

            <textarea id="description" placeholder="Description" rows="5" required></textarea>

            <button type="submit">Add Event</button>

        </form>

    </div>

</div>

<script type="module" src="js/admin.js"></script>
<script type="module" src="js/admin-events.js"></script>

</body>
