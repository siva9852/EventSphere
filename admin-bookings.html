<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bookings - EventSphere</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="dashboard">

    <!-- SIDEBAR -->

    <div class="sidebar">

        <h2>EventSphere</h2>

        <ul>

            <li>
                <a href="admin-dashboard.html">
                    🏠 Dashboard
                </a>
            </li>

            <li>
                <a href="add-event.html">
                    ➕ Add Event
                </a>
            </li>

            <li>
                <a href="view-events.html">
                    🎉 View Events
                </a>
            </li>

            <li>
                <a href="admin-bookings.html"
                   class="active-menu">
                    📅 Bookings
                </a>
            </li>

            <li>
                <a href="admin-customers.html">
                    👥 Customers
                </a>
            </li>

            <li>
                <a href="#" onclick="logout()">
                    🚪 Logout
                </a>
            </li>

        </ul>

    </div>


    <!-- MAIN CONTENT -->

    <div class="dashboard-content bookings-page">

        <h1>Customer Bookings</h1>


        <!-- STATUS FILTERS -->

        <div class="booking-filters">

            <button
                class="filter-btn active-filter"
                onclick="filterBookings('All')">

                <span>All</span>

                <span
                    class="count-badge all-count"
                    id="allCount">
                    0
                </span>

            </button>


            <button
                class="filter-btn"
                onclick="filterBookings('Pending')">

                <span>Pending</span>

                <span
                    class="count-badge pending-count"
                    id="pendingCount">
                    0
                </span>

            </button>


            <button
                class="filter-btn"
                onclick="filterBookings('Approved')">

                <span>Approved</span>

                <span
                    class="count-badge approved-count"
                    id="approvedCount">
                    0
                </span>

            </button>


            <button
                class="filter-btn"
                onclick="filterBookings('Rejected')">

                <span>Rejected</span>

                <span
                    class="count-badge rejected-count"
                    id="rejectedCount">
                    0
                </span>

            </button>

        </div>


        <!-- SEARCH -->

        <div class="booking-search">

            <span>🔍</span>

            <input
                type="text"
                id="bookingSearch"
                placeholder="Search customer, email or event..."
            >

        </div>


        <!-- BOOKINGS -->

        <div id="bookingsContainer">

            <p>Loading bookings...</p>

        </div>

    </div>

</div>


<script type="module"
        src="js/admin-bookings.js">
</script>

</body>

</html>
