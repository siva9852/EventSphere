<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Login - EventSphere</title>

    <link rel="stylesheet"
          href="css/style.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>


<body>


<div class="admin-login-page">

    <div class="admin-login-box">

        <div class="admin-login-icon">

            <i class="fa-solid fa-user-shield"></i>

        </div>


        <h1>
            Admin Login
        </h1>


        <p>
            Login to manage EventSphere.
        </p>


        <form id="adminLoginForm"
              autocomplete="off">


            <input
                type="email"
                id="adminEmail"
                placeholder="Admin Email"
                autocomplete="off"
                required>


            <div class="password-box">

                <input
                    type="password"
                    id="adminPassword"
                    placeholder="Password"
                    autocomplete="new-password"
                    required>


                <i
                    class="fa-solid fa-eye"
                    id="toggleAdminPassword">
                </i>

            </div>


            <button type="submit">

                Login

                <i class="fa-solid fa-arrow-right"></i>

            </button>

        </form>


        <div class="admin-secure">

            <i class="fa-solid fa-shield-halved"></i>

            Secure Admin Access

        </div>

    </div>

</div>



<!-- ================= PASSWORD TOGGLE ================= -->

<script>

const toggleAdminPassword =
    document.getElementById(
        "toggleAdminPassword"
    );


const adminPassword =
    document.getElementById(
        "adminPassword"
    );


toggleAdminPassword.addEventListener(
    "click",
    () => {

        if (
            adminPassword.type ===
            "password"
        ) {

            adminPassword.type =
                "text";


            toggleAdminPassword.classList.remove(
                "fa-eye"
            );


            toggleAdminPassword.classList.add(
                "fa-eye-slash"
            );

        }

        else {

            adminPassword.type =
                "password";


            toggleAdminPassword.classList.remove(
                "fa-eye-slash"
            );


            toggleAdminPassword.classList.add(
                "fa-eye"
            );

        }

    }
);

</script>



<!-- ================= FIREBASE ================= -->

<script type="module"
        src="js/firebase-config.js">
</script>


<script type="module"
        src="js/admin.js">
</script>


</body>

</html>
