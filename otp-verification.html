<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Verify OTP - EventSphere</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="customer-otp-page">

    <div class="customer-otp-box">

        <div class="customer-otp-icon">
            ✉️
        </div>

        <h1>Verify OTP</h1>

        <p>Enter the 6-digit OTP sent to your email.</p>

        <form id="otpForm">

            <div class="customer-otp-input">

                <input type="text" maxlength="1" class="otp-box-input" required>
                <input type="text" maxlength="1" class="otp-box-input" required>
                <input type="text" maxlength="1" class="otp-box-input" required>
                <input type="text" maxlength="1" class="otp-box-input" required>
                <input type="text" maxlength="1" class="otp-box-input" required>
                <input type="text" maxlength="1" class="otp-box-input" required>

            </div>

            <!-- Hidden input for existing OTP JS -->

            <input type="hidden" id="otp">

            <button type="submit">
                Verify OTP
                <span>➤</span>
            </button>

        </form>

        <button id="resendOtp" class="customer-resend-button">
            ↻ &nbsp; Resend OTP
        </button>

        <p class="otp-timer">
            Didn't receive the code?
            <strong>Resend in 00:59</strong>
        </p>

    </div>

</div>

<script>

const otpBoxes = document.querySelectorAll(".otp-box-input");
const otpHidden = document.getElementById("otp");

otpBoxes.forEach((box, index) => {

    box.addEventListener("input", () => {

        box.value = box.value.replace(/\D/g, "");

        if (box.value && index < otpBoxes.length - 1) {
            otpBoxes[index + 1].focus();
        }

        otpHidden.value =
            Array.from(otpBoxes)
            .map(input => input.value)
            .join("");

    });

    box.addEventListener("keydown", (e) => {

        if (
            e.key === "Backspace" &&
            !box.value &&
            index > 0
        ) {
            otpBoxes[index - 1].focus();
        }

    });

});

</script>

<script type="module" src="js/customer-otp.js"></script>

</body>

</html>
